services:

  # ---------------------------------------------------------------------------
  # Infrastructure — always on
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: open_training_platform_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Backend — API
  # ---------------------------------------------------------------------------

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5000:8080"
    env_file:
      - .env.example
      - path: .env.local
        required: false
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: